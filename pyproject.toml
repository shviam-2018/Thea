[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solace-local"
dynamic = ["version"]
description = "A private, local-first AI wellbeing companion"
requires-python = ">=3.12,<3.13"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
solace = "solace.__main__:main"

[tool.setuptools.packages.find]
include = ["solace*"]

[tool.setuptools.dynamic]
version = {attr = "solace.__version__"}
